services:

  tvheadend:
    # Stock lscr.io/linuxserver/tvheadend image. The qnap-pvr
    # fork (pvr-tvheadend:latest, see pvr-tvhd/Dockerfile) was
    # paused on 2026-07-01 after the postproc-webui C-tier
    # route work hit a /pvr/api vs /qnap-api HTTP routing
    # wall that requires upstream-architecture research to
    # resolve. Reverting to the stock image keeps the
    # recording pipeline stable while the next iteration
    # models the fork on a known-good state.
    image: lscr.io/linuxserver/tvheadend:latest
    container_name: tvheadend
    hostname: tvheadend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2G
        reservations:
          cpus: '0.1'
          memory: 128M
    environment:
      # PUID/PGID map the upstream container's internal 'abc'
      # user to the host owner of ${DATA}/tvheadend/config. We
      # use the existing admin uid/gid on the QNAP host. Compose
      # reads PUID/PGID from .env automatically.
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ}
      # Post-processing path mapping (overridable via .env).
      - PVR_HOST_PREFIX=${PVR_HOST_PREFIX}
      - PVR_LOG_PATH=${PVR_LOG_PATH}
    privileged: true
    volumes:
      - ${DATA}/tvheadend/config:/config
      - ${DATA}/tvheadend/epg:/epg
      - ${DATA}/media/recordings:/recordings
      # TVH post-recording hook + shared config. Mounted read-only so
      # TVH cannot mutate the scripts, but edits on the host take effect
      # on next container restart (no rebuild needed).
      - ${DATA}/scripts:/pvr/scripts:ro
      # Shell-only YAML parser used by post-recording.sh. Mounted into
      # /usr/local/bin so the script can . it directly.
      - ${DATA}/scripts/config-loader.sh:/usr/local/bin/config-loader.sh:ro
      # Dedicated "tvhproxy" user definition. The JSON file lives
      # directly under the TVH config tree at
      # ${DATA}/tvheadend/config/accesscontrol/<uuid>; the existing
      # rw-mount of ${DATA}/tvheadend/config onto /config brings it
      # in automatically. No extra bind-mount is needed.
      #
      # Why no bind-mount? Bind-mounting a single file into a
      # rw-mounted parent (here: /config is bind-mounted rw) is
      # fragile — TVH initialises missing files on first start by
      # creating an empty placeholder under the requested name,
      # which then shadows the bind-mount and the file shows up
      # inside the container as a 0-byte stub. Writing the file
      # straight into the config tree avoids that race.
      #
      # The tvhproxy/etc/ and tvhproxy/passwd/ directories in the
      # working tree are the canonical source: they are gitignored
      # because they carry the proxy credential and the LAN allow-list,
      # and the install procedure (or a small helper) is expected to
      # `cp` them into ${DATA}/tvheadend/config/{accesscontrol,
      # passwd}/. See BACKLOG.md for the install-script work item.

      # linuxserver-image's tvh-healthcheck.sh — needed by the
      # compose healthcheck. Bind-mounted read-only.
      - ${DATA}/scripts/tvh-healthcheck.sh:/usr/local/bin/tvh-healthcheck.sh:ro
      # Queue directories shared with the comskip/transcode containers.
      # post-recording.sh appends one JSONL line per recording into
      # both queues; the worker containers read and remove them.
      # These MUST be writable from the tvheadend container.
      - ${DATA}/comskip/queue:/comskip/queue
      - ${DATA}/transcoder/queue:/transcoder/queue
      # Shared scratch directory for transient files (locks, FFmpeg
      # logs, channel-name list). Host-side path lives on the big
      # volume so the 64MB /tmp ramdisk never fills up. The path
      # inside the container is /pvr/tmp — see comskip-pool.sh,
      # transcode-pool.sh, and post-recording.sh.
      - ${DATA}/tmp:/pvr/tmp
    # Host prerequisite: /dev/dvb with at least one frontend* node under
    # adapterN/. Building and loading the DVB kernel modules and firmware
    # is the job of the driver project — see
    # https://github.com/petekaik/qnap-driver-builder. If /dev/dvb is missing here,
    # the fix is on the host, not in this file.
    devices:
      - /dev/dvb:/dev/dvb
    healthcheck:
      # linuxserver/tvheadend ships a tvh-healthcheck.sh that
      # curl's the api/serverinfo endpoint and waits up to 2
      # minutes for the HTTP server to come up. We bind-mount
      # it into the container (the file lives on the host in
      # ${DATA}/scripts/, which is also where post-recording
      # scripts live).
      test: ["CMD", "/usr/local/bin/tvh-healthcheck.sh"]
      interval: 30s
      timeout: 35s
      retries: 5
      start_period: 60s
    networks:
      # eth1 (macvlan) gives TVH its fixed LAN IP (LOCAL_IPV4_1).
      # TVH itself doesn't need to talk to the post-processing
      # worker containers while this rolled-back state lasts;
      # those containers run with network_mode: none and
      # communicate with TVH via shared filesystem queues.
      eth1:
        ipv4_address: ${LOCAL_IPV4_1}

  cc-extract:
    image: pvr-cc-extract:latest
    pull_policy: build
    build:
      context: ./cc-extract
      dockerfile: Dockerfile
    container_name: cc-extract
    hostname: cc-extract
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # CCExtractor is light, but capping CPU keeps a runaway
          # batch (many recordings finishing at once) from starving
          # comskip/transcode/jellyfin on the Celeron. 0.5 core is
          # plenty — typical extraction is a few seconds per hour
          # of video.
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
    environment:
      - TZ=${TZ}
      # Operational disable: set to "false" in .env and restart the
      # container to make cc-extract idle without removing the
      # service from compose. Useful when the storage CPU is
      # overtaxed — see cc-extract/etc/scripts/entrypoint.sh.
      - CC_EXTRACT_ENABLED=${CC_EXTRACT_ENABLED}
      # Orphan sidecar cleanup cron schedule. Same as comskip —
      # default "0 4 * * *" runs at 04:00 daily. The orphan sweep
      # runs even when CC_EXTRACT_ENABLED=false, so disabled state
      # does not cause .srt accumulation.
      - CLEANUP_CRON=${CLEANUP_CRON}
    volumes:
      - ${DATA}/media/recordings:/recordings
      - ${DATA}/tvheadend/config/dvr/log:/config/dvr/log:ro
      # cc-extract config (config.yaml) — host-side edits take
      # effect on container restart, no rebuild needed.
      - ${DATA}/cc-extract/etc:/etc/cc-extract:ro
      # Read-only mount of comskip's done-list. cc-extract does not
      # write here; it tails the file for new lines and reacts.
      - ${DATA}/comskip/queue:/comskip/queue:ro
      - ${DATA}/cc-extract/queue:/cc-extract/queue
      - ${DATA}/tmp:/pvr/tmp
    # network_mode: none — same logic as comskip/transcode. ccextractor
    # reads only local files and does not call out. The pool script
    # tail -F's a host-mounted file. No network needed at runtime.
    network_mode: none

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2G
        reservations:
          cpus: '0.1'
          memory: 128M
    volumes:
      - ${DATA}/jellyfin/config:/config
      - ${DATA}/jellyfin/cache:/cache
      - ${DATA}/media/recordings:/recordings
      - ${DATA}/media/transcoded:/media/transcoded
      - ${DATA}/media/tv:/tv
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=${TZ}
    networks:
      eth1:
        ipv4_address: ${LOCAL_IPV4_2}

  comskip:
    image: pvr-comskip:latest
    pull_policy: build
    build:
      context: ./comskip
      dockerfile: Dockerfile
    container_name: comskip
    hostname: comskip
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 64M
    environment:
      - TZ=${TZ}
      # Orphan sidecar cleanup cron schedule. Default "0 4 * * *"
      # runs at 04:00 daily — the same quiet hour as the transcode
      # container's nightly job, so we concentrate I/O when the
      # storage is otherwise idle. Override in .env to retune.
      - CLEANUP_CRON=${CLEANUP_CRON}
    volumes:
      - ${DATA}/media/recordings:/recordings
      - ${DATA}/tvheadend/config/dvr/log:/config/dvr/log:ro
      # Comskip config and runtime scripts live under comskip/etc on
      # the host. The entrypoint and pool script are image-baked; this
      # mount overrides the host copy of config.yaml and comskip.ini.
      - ${DATA}/comskip/etc:/etc/comskip:ro
      - ${DATA}/comskip/queue:/comskip/queue
      - ${DATA}/tmp:/pvr/tmp
    # network_mode: none — this container has no use for any network
    # at runtime. Communication with TVH happens through the shared
    # ${DATA}/comskip/queue filesystem, not over TCP. The comskip
    # binary does not phone home, the pool script does not fetch
    # anything, and the entrypoint does not call out. Cutting the
    # network means a compromised comskip binary cannot exfiltrate
    # data or reach the host's other services. The build phase
    # (docker build) uses its own build network and is unaffected.
    network_mode: none

  transcode:
    image: pvr-transcode:latest
    pull_policy: build
    build:
      context: ./transcoder
      dockerfile: Dockerfile
    container_name: transcode
    hostname: transcode
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2G
        reservations:
          cpus: '0.1'
          memory: 64M
    environment:
      - TZ=${TZ}
      - TRANSCODE_CRON=${TRANSCODE_CRON}
    volumes:
      - ${DATA}/media/recordings:/recordings
      - ${DATA}/media/transcoded:/media/transcoded
      - ${DATA}/tvheadend/config/dvr/log:/config/dvr/log:ro
      - ${DATA}/transcoder/scripts:/etc/transcoder:ro
      - ${DATA}/transcoder/queue:/transcoder/queue
      - ${DATA}/tmp:/pvr/tmp
    # network_mode: none — see comskip comment above. FFmpeg reads
    # only local files, generate-nfo.py only calls a local Jellyfin
    # URL through the shared /media/transcoded filesystem (it does
    # not actually call the Jellyfin HTTP API at runtime — the
    # JELLYFIN_API_KEY env var is reserved for future use), and
    # the pool/entrypoint scripts do no network I/O.
    network_mode: none

  # pvr-queue-exposer — HTTP bridge that serves PVR queue files
  # and logs as JSON. Read-only MVP: GET /api/* endpoints, no
  # POST. Lives on the isolated `pvr_internal` Docker network
  # so it can read the queue file mounts from comskip and
  # transcode. While the postproc webui work is paused, the
  # browser has no way to reach this service (no in-TVH
  # proxy), so it serves TVH-side compositing tools only.
  # When the plan at ~/.hermes/plans/postproc-webui.md is
  # executed, this service will gain a small in-TVH reverse
  # proxy, and the macvlan connection will be dropped.
  pvr-queue-exposer:
    image: pvr-queue-exposer:latest
    pull_policy: build
    build:
      context: ./pvr-queue-exposer
    container_name: pvr-queue-exposer
    hostname: pvr-queue-exposer
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
    environment:
      - TZ=${TZ}
      - COMSKIP_QUEUE=/comskip/queue/comskip-queue.jsonl
      - COMSKIP_DONE=/comskip/queue/comskip-queue.done
      - COMSKIP_LOG=/comskip/queue/comskip.log
      - TRANSCODE_QUEUE=/transcoder/queue/transcode-queue.jsonl
      - TRANSCODE_DONE=/transcoder/queue/transcode-queue.done
      - TRANSCODE_LOG=/var/log/transcode-nightly.log
    volumes:
      # Same queue mounts as comskip and transcode — read-only
      # is enough for MVP.
      - ${DATA}/comskip/queue:/comskip/queue:ro
      - ${DATA}/transcoder/queue:/transcoder/queue:ro
      - ${DATA}/tvheadend/config/dvr/log:/var/log:ro
    networks:
      - pvr_internal
    healthcheck:
      # 127.0.0.1 (not localhost) to dodge Alpine IPv6-first
      # DNS behaviour. Python http.server takes a moment to
      # warm up after container start — generous start_period.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8765/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  tvhproxy:
    # TVH → HDHomeRun-protokollaemulaattori. Perustuu chkuendig/
    # tvhProxy-forkkiin (aktiivisin fork jkabergin arkistoidusta
    # alkuperäisestä). Kuuntelee HDHomeRun-protokollaa portissa 5004
    # ja lähettää SSDP-multicastia UDP 239.255.255.250:1900 jotta
    # Jellyfin iOS -client löytää tämän automaattisesti lähiverkossa.
    #
    # Verkko: macvlan eth1:llä, kiinteä IP .56 — TVH (.52) ja
    # tvhproxy (.56) ovat samassa broadcast-domainissa joten
    # multicast-discovery toimii. SSDP-multicast-pakettien lähettäminen
    # vaatii IP_MULTICAST/IGMP-socketin, joka toimii macvlan+eth1:n
    # kautta (testattu storage-palvelimella).
    #
    # Ei network_mode: host -tilaan, jotta port 9981 pysyy
    # macvlan-IP:n takana eikä altistu suoraan LAN:lle.
    image: pvr-tvhproxy:latest
    pull_policy: build
    build:
      context: ./tvhproxy
      dockerfile: Dockerfile
    container_name: tvhproxy
    hostname: tvhproxy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          # tvhproxy on kevyt Flask+SSDP-palvelin, ei tarvitse
          # paljon CPU:a. Multicast-pakettien lähetys on kuitenkin
          # verkko-operaatio joka voi hetkellisesti kuormittaa.
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
    env_file:
      # Tämä on ohut kerros .env-tiedoston päälle: vain muuttujat
      # joita tvhproxy tarvitsee. .env.example määrittää oletusarvot
      # ja compose-ympäristö overridaa ne.
      - path: ${DATA}/tvhproxy/.env
        required: false
    environment:
      # tvhProxy.py reads these as standalone config keys (it does NOT
      # parse user/pass out of TVH_URL), and env_file entries that
      # contain $ in the value can be stripped by docker-compose's env
      # interpolation depending on QNAP's Container Station version, so
      # pass them explicitly from the gitignored .env. The values MUST
      # match TVH_URL above; rotate together.
      TVH_USER: ${TVH_USER}
      TVH_PASSWORD: ${TVH_PASSWORD}
      # Kanavalogot tarjotaan polussa /picons/ (ks. volumes alla).
      PICONS_DIR: /picons
    volumes:
      # Piconit eli TVH:n kanavalogot, read-only.
      #
      # Miksi täällä: TVH antaa HTSP-asiakkaille kanavaikonin polkuna
      # file:///picons/<nimi>.png. Yksikään HTTP-asiakas ei voi noutaa
      # file://-osoitetta, joten Jellyfin lokittaa UriFormatExceptionin
      # jokaisesta kanavasta jokaisella EPG-päivityksellä eikä näytä
      # kanavalogoa lainkaan (mitattu 2026-10-10: 34 virhettä / 3 vrk,
      # 21 kanavaa). TVH:n oma webui näyttää ne, koska se hakee kuvat
      # /imagecache-reitin kautta — se reitti on autentikoitu eikä
      # hyväksy nimeä, joten sitä ei voi käyttää tähän.
      #
      # Host-puolen portti ei auttaisi: Jellyfin on macvlan-lapsi eikä
      # tavoita isäntänsä IP:tä. tvhproxyllä on oma macvlan-IP samassa
      # broadcast-domainissa, joten se kelpaa jakelijaksi.
      #
      # Kopioi kuvat isäntään kertaalleen (ne ovat tvheadend-imagen
      # sisällä, ei host-polkua):
      #   docker cp tvheadend:/picons ${DATA}/picons
      # ja osoita sitten TVH:n kanavaikonit tänne — ks. README.
      - ${DATA}/picons:/picons:ro
    networks:
      eth1:
        ipv4_address: ${LOCAL_IPV4_3}
    healthcheck:
      # discover.json palauttaa HDHomeRun-laitteen metadatan.
      # healthcheck varmistaa että Flask-vastaa ja SSDP-rekisteröinti
      # on suoritettu (käynnistys kestää ~5s Python + Flaskin
      # importtien takia).
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5004/discover.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  pvr_internal:
    name: pvr_internal
    internal: true
    ipam:
      config:
        - subnet: 172.25.0.0/16  # secretscan:ignore (compose-internal network, not a host address)
  eth1:
    external: true
    name: eth1